<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>YadoViet - Loading</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        html, body {
            width: 100%;
            height: 100%;
            background-color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            -webkit-font-smoothing: antialiased;
            user-select: none;
            overflow: hidden;
        }
        .container {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
        }
        .top-spacer {
            height: 2.5rem; /* h-10 (40px) */
            width: 100%;
        }
        .center-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding-left: 1.5rem; /* px-6 */
            padding-right: 1.5rem;
            width: 100%;
        }
        .brand-logo-wrap {
            display: flex;
            align-items: center;
            margin-bottom: 2rem; /* mb-8 (32px) */
            filter: drop-shadow(0 4px 12px rgba(3, 44, 149, 0.08));
        }
        .brand-logo-text {
            font-size: 38px;
            font-weight: 900;
            letter-spacing: -0.05em; /* tracking-tight */
            color: #032C95;
            line-height: 1;
        }
        .orbit-dots-wrapper {
            position: relative;
            width: 44px;
            height: 44px;
            animation: spinClockwise 1.3s cubic-bezier(0.5, 0.1, 0.5, 0.9) infinite;
        }
        .dot-item {
            position: absolute;
            width: 10px;
            height: 10px;
            border-radius: 50%;
        }
        .dot-item:nth-child(1) {
            top: 0;
            left: 17px;
            background: #032C95;
            box-shadow: 0 0 10px rgba(3, 44, 149, 0.45);
        }
        .dot-item:nth-child(2) {
            bottom: 4px;
            left: 3px;
            background: #096DFC;
            box-shadow: 0 0 10px rgba(9, 109, 252, 0.45);
        }
        .dot-item:nth-child(3) {
            bottom: 4px;
            right: 3px;
            background: #00b14f;
            box-shadow: 0 0 10px rgba(0, 177, 79, 0.45);
        }
        @keyframes spinClockwise {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .bottom-spacer {
            padding-bottom: 2rem; /* pb-8 */
            width: 100%;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="top-spacer"></div>
        <div class="center-content">
            <div class="brand-logo-wrap">
                <span class="brand-logo-text">YadoViet</span>
            </div>
            <div class="orbit-dots-wrapper">
                <span class="dot-item"></span>
                <span class="dot-item"></span>
                <span class="dot-item"></span>
            </div>
        </div>
        <div class="bottom-spacer"></div>
    </div>
</body>
</html>
